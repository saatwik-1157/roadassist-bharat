#cloud-config
# RoadAssist Bharat on one OCI Always Free Ampere A1 VM (India region).
#
# GENERATED by build-cloud-init.mjs from the files beside it - do not edit by
# hand. Paste this WHOLE file into "Advanced options -> Management ->
# Initialization script -> Paste cloud-init script" when creating the instance
# (README step b). Shape VM.Standard.A1.Flex; image Canonical Ubuntu 24.04
# aarch64 (recommended) or Oracle Linux 9 aarch64.
#
# On first boot it writes compose.yml, Caddyfile and the database's first-start
# script into /opt/roadassist, then runs bootstrap.sh: opens 80/443 in the HOST
# firewall (OCI's images block them; the VCN security list is a separate
# firewall you open in the console), installs Docker + compose from Docker's
# own repository, clones the repository (for least-privilege-role.sql,
# backup.sh and migrate-db.sh) and pre-pulls the images.
#
# It holds NO secrets and does NOT start anything: /opt/roadassist/.env does not
# exist yet. You write it over SSH (README step c).
# Progress and errors: /var/log/roadassist-bootstrap.log

write_files:
  - path: /opt/roadassist/Caddyfile
    permissions: "0644"
    content: |
      # RoadAssist Bharat on the OCI India VM: Caddy terminates HTTPS itself.
      #
      # There is no Cloudflare in front of this VM (the edge in front of the live
      # Render site is Render's own and does not follow the DNS record here), so the
      # certificate must be a real public one. Caddy gets it from Let's Encrypt by
      # itself on ports 80/443 once the name resolves to this VM, and renews it.
      # NOT `tls internal`: a browser rejects Caddy's internal CA (that was the
      # removed AWS kit's mistake, git history at 3d0340b:deploy/aws).
      #
      # cloud-init.yaml embeds this file: after editing it, run
      # node deploy/oci-india/build-cloud-init.mjs
      #
      # SITE_ADDRESSES comes from /opt/roadassist/.env through compose.yml. Unset, it
      # is the live name. While testing before the DNS switch it is the temporary
      # precheck name (README step e), so Caddy never asks Let's Encrypt for the live
      # name while that name still points at Render - those failures count against
      # Let's Encrypt's per-name limit and push Caddy's next retry back.
      {$SITE_ADDRESSES:app.roadassistbharat.online} {
      	encode zstd gzip

      	# The app listens on 8080 inside the compose network and is not published
      	# on the host, so Caddy is the only way in.
      	reverse_proxy app:8080 {
      		# Caddy REPLACES any X-Forwarded-For a client sends with the address
      		# that really connected (no trusted_proxies is configured here), and the
      		# app believes it only from Caddy's fixed address (TRUST_PROXY in
      		# compose.yml). These headers are passed through untouched by default,
      		# and nothing in front of Caddy sets them, so a client could write any
      		# address into them: strip them, so a stale CLIENT_IP_HEADER copied
      		# from Render (cf-connecting-ip) can never be fed a forged value.
      		header_up -CF-Connecting-IP
      		header_up -True-Client-IP
      		header_up -X-Real-IP
      	}
      }

  - path: /opt/roadassist/compose.yml
    permissions: "0644"
    content: |
      # RoadAssist Bharat on one OCI Always Free Ampere A1 VM (India region).
      #
      # Written to /opt/roadassist/compose.yml by cloud-init.yaml, which embeds this
      # file (after editing it, run node deploy/oci-india/build-cloud-init.mjs).
      # Every ${...} comes from /opt/roadassist/.env (see env.example).
      #
      #   cd /opt/roadassist && sudo docker compose up -d
      #
      # db       PostgreSQL 16 + PostGIS 3.4, on this VM. No host port.
      # app      the image Render runs (multi-arch, publish-image.yml)
      # caddy    HTTPS with a Let's Encrypt certificate, ports 80/443
      # backup   daily verified pg_dump into /opt/roadassist/backups, 7 kept
      # db-grants  one-shot: re-applies least-privilege-role.sql after migrations
      #
      # ONE VM: no managed backups, no replica, no failover. See README, "What this
      # setup is and is not".
      name: roadassist

      x-db-image: &db-image
        # PostgreSQL 16 + PostGIS 3.4, as docker-compose.demo.yml runs it locally.
        # NOT postgis/postgis:16-3.4 itself: that tag is published for amd64 only and
        # this VM is arm64. imresamu/postgis is the multi-arch build of the same
        # postgis/docker-postgis Dockerfiles (same entrypoint, same variables).
        image: imresamu/postgis:16-3.4

      services:
        db:
          <<: *db-image
          restart: unless-stopped
          environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
            POSTGRES_DB: roadassist
            POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
            # Read once, by db-init/10-roadassist-roles.sh, on the very first start.
            DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD in .env}
            DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}
          # NO `ports:`. The database is reachable only on the internal `data`
          # network, by the name `db`, from the services below. Not from the
          # internet, and not even from the VM's own shell except through Docker.
          networks:
            data: {}
          volumes:
            - pgdata:/var/lib/postgresql/data
            - ./db-init:/docker-entrypoint-initdb.d:ro
            - ./repo/app/packages/db/sql:/roadassist-sql:ro
          healthcheck:
            # -h 127.0.0.1: a TCP check, so the temporary init-time server (unix
            # socket only) does not count as ready. Same reasoning as the demo file.
            test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d roadassist"]
            interval: 5s
            timeout: 3s
            retries: 30
            start_period: 30s
          stop_grace_period: 60s
          logging: &logging
            driver: json-file
            options:
              max-size: "10m"
              max-file: "5"

        app:
          image: ghcr.io/saatwik-1157/roadassist-bharat:${IMAGE_TAG:-latest}
          # Migrate as the owner, unset the owner's string, seed the demo fleet,
          # then serve - exactly what Render runs.
          command: ["./docker-start.sh"]
          restart: unless-stopped
          depends_on:
            db:
              condition: service_healthy
          # Listed one by one, NOT env_file: .env also holds the superuser's and the
          # owner's passwords, and only what is listed here reaches the app.
          environment:
            NODE_ENV: ${NODE_ENV:-demo}
            PORT: "8080"
            HOST: "0.0.0.0"
            # `db` is a single-label container name, so the driver connects without
            # TLS (packages/db/src/client.ts, requiredSsl); the traffic never leaves
            # the internal network.
            DATABASE_URL: postgres://roadassist_app:${DB_APP_PASSWORD}@db:5432/roadassist
            # docker-start.sh migrates with this, then unsets it before the API and
            # the seeds start.
            MIGRATION_DATABASE_URL: postgres://roadassist_owner:${DB_OWNER_PASSWORD}@db:5432/roadassist
            JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
            # Believe X-Forwarded-For / X-Forwarded-Proto only from Caddy's fixed
            # address below. Caddy overwrites X-Forwarded-For with the address that
            # really connected, so req.ip is the caller and the per-IP OTP ceiling
            # counts each caller separately; X-Forwarded-Proto makes req.protocol
            # "https", which is what turns HSTS on.
            TRUST_PROXY: "172.30.53.10"
            # EMPTY on purpose. On Render this is cf-connecting-ip, because
            # Cloudflare overwrites that header. Nothing here does, so trusting it
            # would let any caller pick their own address. (Caddy strips it too.)
            CLIENT_IP_HEADER: ""
            CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env}
            SMS_PROVIDER: ${SMS_PROVIDER:-console}
            PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-mock}
            EXPOSE_DEV_OTP: ${EXPOSE_DEV_OTP:-true}
            SEED_DEMO_FLEET: ${SEED_DEMO_FLEET:-true}
            UPLOAD_DIR: /repo/app/var/uploads
            EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
            EMAIL_BASE_URL: ${EMAIL_BASE_URL:-}
            EMAIL_FROM: "${EMAIL_FROM:-RoadAssist <no-reply@roadassist.in>}"
            EMAIL_API_KEY: ${EMAIL_API_KEY:-}
            ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
            ALERT_LABEL: "${ALERT_LABEL:-RoadAssist-Bharat on OCI India}"
            EMAIL_SIGNIN: ${EMAIL_SIGNIN:-}
            # Telegram alerts for emergency contacts: off unless all three are set.
            TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
            TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
            TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
          # Not published on the host: only Caddy, on `edge`, reaches it.
          expose:
            - "8080"
          networks:
            edge: {}     # Caddy, and the way out (Resend, map and weather services)
            data: {}     # the database
          volumes:
            # Only used with PHOTO_STORE=disk; demo mode keeps photos in the database.
            - uploads:/repo/app/var
          stop_grace_period: 30s
          healthcheck:
            # /health answers 503 when the database is unreachable: readiness, not
            # merely "the process is alive".
            test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8080/health || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 90s
          logging: *logging

        caddy:
          image: caddy:2-alpine
          restart: unless-stopped
          ports:
            - "80:80"         # ACME HTTP-01 challenge and the redirect to https
            - "443:443"       # HTTPS
            - "443:443/udp"   # HTTP/3
          environment:
            SITE_ADDRESSES: ${SITE_ADDRESSES:-app.roadassistbharat.online}
          volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            # Certificates and the ACME account. Losing them means asking Let's
            # Encrypt again, which is rate limited, so they live in a named volume.
            - caddy_data:/data
            - caddy_config:/config
          networks:
            edge:
              ipv4_address: 172.30.53.10
          depends_on:
            - app
          healthcheck:
            # The admin API listens on localhost inside the container only.
            test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:2019/config/ || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
          logging: *logging

        # The repository's own nightly backup (app/scripts/backup.sh, also used by
        # app/docker-compose.prod.yml): a dump at BACKUP_AT_HOUR UTC and one at
        # start, each restored into a scratch database and checked (audit_log rows,
        # append-only rules) before it is trusted; older dumps pruned only after a
        # good one. 21 UTC is 02:30 IST. KEEP_DAYS=6 deletes dumps 7+ days old, so
        # the last 7 daily dumps stay. They land in /opt/roadassist/backups on the
        # VM: copy them OFF the VM yourself (README, "Backups").
        backup:
          <<: *db-image
          restart: unless-stopped
          depends_on:
            db:
              condition: service_healthy
          environment:
            PGHOST: db
            PGPASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_USER: postgres
            POSTGRES_DB: roadassist
            BACKUP_AT_HOUR: ${BACKUP_AT_HOUR:-21}
            BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-6}
            BACKUP_VERIFY: "1"
          entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
          networks:
            data: {}
          volumes:
            - ./backups:/backups
            - ./repo/app/scripts/backup.sh:/usr/local/bin/backup.sh:ro
          logging: *logging

        # One-shot, after the app is healthy (so its migrations have run): the
        # least-privilege file again, as the owner. It grants the app DML on tables
        # that now exist and takes UPDATE/DELETE on audit_log away - the default
        # privileges set at first start cannot express that exception.
        db-grants:
          <<: *db-image
          restart: "no"
          depends_on:
            app:
              condition: service_healthy
          environment:
            PGPASSWORD: ${DB_OWNER_PASSWORD}
          entrypoint:
            - psql
            - "--host=db"
            - "--username=roadassist_owner"
            - "--dbname=roadassist"
            - "--no-psqlrc"
            - "--quiet"
            - "--set=ON_ERROR_STOP=1"
            - "--file=/roadassist-sql/least-privilege-role.sql"
          networks:
            data: {}
          volumes:
            - ./repo/app/packages/db/sql:/roadassist-sql:ro
          logging: *logging

      networks:
        edge:
          ipam:
            config:
              # Fixed, so Caddy's address (and therefore TRUST_PROXY) is fixed.
              - subnet: 172.30.53.0/24
        data:
          # No route to the outside world at all: nothing on it can reach the
          # internet, and nothing outside can reach it.
          internal: true

      volumes:
        pgdata:
        uploads:
        caddy_data:
        caddy_config:

  - path: /opt/roadassist/db-init/10-roadassist-roles.sh
    permissions: "0755"
    content: |
      #!/bin/sh
      # First start of the VM's database ONLY (the postgres image runs
      # /docker-entrypoint-initdb.d/* when the data volume is empty, never again).
      # Written to /opt/roadassist/db-init/ by cloud-init.yaml, which embeds this file
      # (after editing it, run node deploy/oci-india/build-cloud-init.mjs).
      #
      # Three roles, the same split as on Neon:
      #   postgres          superuser. Backups and this script; the app never sees it.
      #   roadassist_owner  owns the database and every table; migrations run as it
      #                     (MIGRATION_DATABASE_URL), then docker-start.sh unsets it.
      #                     CREATEROLE only so it can create and manage
      #                     roadassist_app, exactly like neondb_owner on Neon.
      #   roadassist_app    the API's role: rows, never schema
      #                     (app/packages/db/sql/least-privilege-role.sql).
      #
      # Passwords come from /opt/roadassist/.env through compose.yml and are read
      # with \getenv, so they never appear in a process list. Changing them in .env
      # later does NOT change them here: see README, "Changing a database password".
      set -eu
      : "${DB_OWNER_PASSWORD:?DB_OWNER_PASSWORD is not set}"
      : "${DB_APP_PASSWORD:?DB_APP_PASSWORD is not set}"

      # As the superuser: the owner role, the database's ownership, and the two
      # extensions migrate.ts asks for. PostGIS is not a trusted extension, so only
      # a superuser may create it; migrate.ts's CREATE EXTENSION IF NOT EXISTS then
      # finds it present and needs no such right.
      psql -v ON_ERROR_STOP=1 -X -q --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<'SQL'
      \getenv owner_pw DB_OWNER_PASSWORD
      \getenv dbname POSTGRES_DB
      CREATE ROLE roadassist_owner LOGIN CREATEROLE NOSUPERUSER NOCREATEDB PASSWORD :'owner_pw';
      ALTER DATABASE :"dbname" OWNER TO roadassist_owner;
      CREATE EXTENSION IF NOT EXISTS postgis;
      CREATE EXTENSION IF NOT EXISTS pgcrypto;
      SQL

      # As the OWNER (over the init server's unix socket): the repository's own
      # least-privilege file creates roadassist_app and sets default privileges, so
      # every table the owner creates from now on - the migrations at first boot, or
      # migrate-db.sh's restore - is readable and writable by the app and nothing
      # more. The db-grants service runs the same file again after each start, once
      # the tables exist, which is what takes UPDATE/DELETE on audit_log away.
      psql -v ON_ERROR_STOP=1 -X -q --username roadassist_owner --dbname "$POSTGRES_DB" \
        -f /roadassist-sql/least-privilege-role.sql >/dev/null
      psql -v ON_ERROR_STOP=1 -X -q --username roadassist_owner --dbname "$POSTGRES_DB" <<'SQL'
      \getenv app_pw DB_APP_PASSWORD
      ALTER ROLE roadassist_app WITH PASSWORD :'app_pw';
      SQL

      echo "roadassist: roles roadassist_owner and roadassist_app created"

  - path: /usr/local/sbin/roadassist-bootstrap.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      # First-boot setup for the RoadAssist OCI VM, run by cloud-init.yaml (which
      # embeds this file as /usr/local/sbin/roadassist-bootstrap.sh). Idempotent:
      #   sudo /usr/local/sbin/roadassist-bootstrap.sh
      # Log: /var/log/roadassist-bootstrap.log
      set -euo pipefail
      exec >>/var/log/roadassist-bootstrap.log 2>&1
      echo "=== roadassist bootstrap $(date -u +%FT%TZ) ==="

      REPO_URL="https://github.com/saatwik-1157/roadassist-bharat.git"
      DIR=/opt/roadassist

      # shellcheck source=/dev/null
      . /etc/os-release

      # OCI's Ubuntu images keep their rules in /etc/iptables/rules.v4 (loaded at
      # boot by netfilter-persistent) and end INPUT with a blanket REJECT, so a rule
      # appended after it never matches. Insert 80/443 BEFORE the REJECT, live and in
      # the saved file. The file is edited directly rather than re-saved with
      # netfilter-persistent, so Docker's own chains are never frozen into it.
      open_ports_iptables() {
        local rules=/etc/iptables/rules.v4 rule pos
        for rule in "-p tcp -m state --state NEW -m tcp --dport 80 -j ACCEPT" \
                    "-p tcp -m state --state NEW -m tcp --dport 443 -j ACCEPT" \
                    "-p udp -m state --state NEW -m udp --dport 443 -j ACCEPT"; do
          # shellcheck disable=SC2086  # $rule is deliberately split into words
          if ! iptables -C INPUT $rule 2>/dev/null; then
            pos=$(iptables -L INPUT --line-numbers -n | awk '$2 == "REJECT" { print $1; exit }')
            if [ -n "$pos" ]; then
              # shellcheck disable=SC2086
              iptables -I INPUT "$pos" $rule
            else
              # shellcheck disable=SC2086
              iptables -A INPUT $rule
            fi
          fi
          if [ -f "$rules" ] && ! grep -qF -- "-A INPUT $rule" "$rules"; then
            if awk -v line="-A INPUT $rule" '
                !done && /^-A INPUT -j REJECT/ { print line; done = 1 }
                { print }
                END { if (!done) exit 3 }' "$rules" >"$rules.new"; then
              mv "$rules.new" "$rules"
            else
              rm -f "$rules.new"
              echo "no REJECT line in $rules; the live rule is in place, the saved file unchanged"
            fi
          fi
        done
        echo "host firewall: 80/tcp, 443/tcp, 443/udp open (iptables)"
      }

      open_ports_firewalld() {
        if systemctl is-active --quiet firewalld; then
          firewall-cmd --permanent --add-service=http
          firewall-cmd --permanent --add-service=https
          firewall-cmd --permanent --add-port=443/udp
          firewall-cmd --reload
          echo "host firewall: http, https, 443/udp open (firewalld)"
        else
          echo "firewalld is not running; using iptables"
          open_ports_iptables
        fi
      }

      install_docker_ubuntu() {
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -y
        apt-get install -y ca-certificates curl git
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        chmod a+r /etc/apt/keyrings/docker.asc
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" \
          >/etc/apt/sources.list.d/docker.list
        apt-get update -y
        apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      }

      install_docker_oracle() {
        # Podman and its runc conflict with docker-ce's containerd.io.
        dnf remove -y podman buildah runc || true
        dnf install -y dnf-plugins-core git
        dnf config-manager --add-repo https://download.docker.com/linux/rhel/docker-ce.repo
        dnf install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      }

      # Ports first, Docker second: Docker inserts its own chains at the top of
      # FORWARD when it starts, ahead of the image's REJECT.
      case "${ID}" in
        ubuntu)
          open_ports_iptables
          command -v docker >/dev/null || install_docker_ubuntu
          ;;
        ol|rhel|centos|rocky|almalinux)
          open_ports_firewalld
          command -v docker >/dev/null || install_docker_oracle
          ;;
        *)
          echo "unsupported image: ${ID}. Use Ubuntu 24.04 or Oracle Linux 9 (aarch64)."
          exit 1
          ;;
      esac

      systemctl enable --now docker
      docker version --format 'docker {{.Server.Version}} on {{.Server.Arch}}'
      docker compose version

      # The repository: least-privilege-role.sql and backup.sh are mounted from it
      # (one copy of each, the reviewed one), and migrate-db.sh runs from it.
      if [ -d "$DIR/repo/.git" ]; then
        git -C "$DIR/repo" pull --ff-only || echo "WARNING: git pull failed; keeping the existing clone"
      else
        git clone --depth 1 "$REPO_URL" "$DIR/repo"
      fi
      for f in app/packages/db/sql/least-privilege-role.sql app/scripts/backup.sh deploy/oci-india/migrate-db.sh; do
        [ -f "$DIR/repo/$f" ] || { echo "ERROR: $DIR/repo/$f is missing - is deploy/oci-india pushed to main?"; exit 1; }
      done

      # Dumps hold personal data: root only.
      install -d -m 0700 "$DIR/backups"

      # The images, so the first `docker compose up -d` is quick. Not fatal: `up`
      # pulls whatever is missing.
      docker pull ghcr.io/saatwik-1157/roadassist-bharat:latest \
        || echo "WARNING: app image pull failed - is the arm64 build published yet? (README, before you start)"
      docker pull imresamu/postgis:16-3.4 || true
      docker pull caddy:2-alpine || true

      touch "$DIR/BOOTSTRAP_DONE"
      echo "=== done. Next: write $DIR/.env (README step c) ==="

runcmd:
  - [/usr/local/sbin/roadassist-bootstrap.sh]
