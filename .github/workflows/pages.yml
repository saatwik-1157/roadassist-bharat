# Publish the project showcase to GitHub Pages.
#
# Pages serves static files, so this is NOT the application: the API needs a
# long-lived process for its SSE streams and its offer-expiry sweeper, and a
# PostGIS database. The page says so in its own first paragraph rather than
# letting a reader assume otherwise.
#
# What it is: screenshots and recordings of the running system, the measured
# numbers, and the one command that brings the real platform up locally.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - "app/docs/screenshots/**"
      - "site/*.mp4"
      - "ppt/assets/vis_*.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one in flight, because a half-applied
# Pages deployment is a broken public URL rather than a delayed one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Assemble the site
        run: |
          mkdir -p _site/shots _site/media _site/visuals
          cp pages/index.html _site/
          # A custom domain would go here as pages/CNAME, copied into the
          # artefact. It is deliberately absent: setting one BEFORE the
          # domain's DNS points at GitHub makes the working github.io URL
          # 301 to a domain that is still parked, which takes the site down
          # rather than moving it. Point the DNS first, then add the file.
          [ -f pages/CNAME ] && cp pages/CNAME _site/ || true
          cp app/docs/screenshots/*.png _site/shots/
          # The web-sized copies pages/build-thumbs.py makes: the page loads
          # these into tiles and device frames and keeps the untouched PNGs
          # above for the lightbox. Built locally and committed rather than
          # here, so what reviewers saw in the PR is what gets published.
          mkdir -p _site/shots/thumbs _site/shots/stage
          cp app/docs/screenshots/thumbs/*.webp _site/shots/thumbs/
          cp app/docs/screenshots/stage/*.webp  _site/shots/stage/
          # Only the two the page actually embeds. The rest are large and
          # nothing links to them, and an unreferenced 29 MB of video is a
          # slower page for no reason.
          cp site/roadassist-app-demo.mp4 _site/media/
          cp site/raksha-full-demo.mp4    _site/media/
          # The generated 3D visuals, all of them: naming three by hand meant
          # adding a fourth to the page failed the build instead of shipping.
          # render_visuals.py builds them from the
          # real screenshots above and refuses a landscape capture in a phone
          # frame, which is how the hero silently rendered as overlap once.
          cp ppt/assets/vis_*.png _site/visuals/
          # Jekyll would otherwise try to process this and skip _-prefixed files.
          touch _site/.nojekyll

      # The same promise the application makes, checked for the public page:
      # a webfont or a script from somebody else's CDN sends every visitor's
      # IP address abroad, which is what non-negotiable #4 forbids.
      #
      # Two things are NOT third parties and must not fail this: this site's own
      # canonical and og: URLs, which are metadata a browser never fetches, and
      # links to the repository on github.com.
      - name: No third-party subresource on the public page
        run: |
          offenders=$(grep -nEo '(src|href)="https?://[^"]+' _site/index.html \
            | grep -viE 'github\.com|roadassistbharat\.online' || true)
          if [ -n "$offenders" ]; then
            echo "$offenders"
            echo "::error::the showcase page loads something from another origin"
            exit 1
          fi
          echo "  clean - every asset is served from this origin"

      - name: Every referenced asset must exist
        run: |
          fail=0
          for ref in $(grep -oE '(src|poster)="[^"h][^"]*"' _site/index.html | cut -d'"' -f2 | sort -u); do
            if [ -f "_site/$ref" ]; then echo "  ok   $ref"; else echo "  MISS $ref"; fail=1; fi
          done
          # The journey switcher builds its image URL in script from
          # data-shot, so the grep above never sees those paths. A renamed
          # screenshot would pass it and then show a broken frame on click.
          for shot in $(grep -oE 'data-shot="[^"]+"' _site/index.html | cut -d'"' -f2 | sort -u); do
            ref="shots/stage/$shot.webp"
            if [ -f "_site/$ref" ]; then echo "  ok   $ref (switcher)"; else echo "  MISS $ref (switcher)"; fail=1; fi
          done
          exit $fail

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
