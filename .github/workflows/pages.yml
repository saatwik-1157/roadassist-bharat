# Publish the project showcase to GitHub Pages.
#
# Pages serves static files, so this is NOT the application: the API needs a
# long-lived process for its SSE streams and its offer-expiry sweeper, and a
# PostGIS database. The page says so in its own first paragraph rather than
# letting a reader assume otherwise.
#
# What it is: screenshots and recordings of the running system, the measured
# numbers, and the one command that brings the real platform up locally.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - "app/docs/screenshots/**"
      - "site/*.mp4"
      - "ppt/assets/vis_*.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one in flight, because a half-applied
# Pages deployment is a broken public URL rather than a delayed one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Assemble the site
        run: |
          mkdir -p _site/shots _site/media _site/visuals
          cp pages/index.html _site/
          # Search engines: the sitemap (with image entries) and robots.txt. A
          # Google Search Console HTML verification file, if one is added as
          # pages/google*.html, is published beside them; the nullglob keeps an
          # absent one from failing the step.
          cp pages/sitemap.xml pages/robots.txt _site/
          shopt -s nullglob; for f in pages/google*.html; do cp "$f" _site/; done; shopt -u nullglob
          # The public address of a running platform, if there is one. Empty
          # means the page shows screenshots; see the comment where it is read.
          cp pages/live.json _site/
          # The logo, favicon and home-screen icons the page's <head> and nav use.
          mkdir -p _site/brand
          cp pages/brand/* _site/brand/
          # The Blender render of the layers model: the "Every layer, live in
          # 3D" frame shows it until the platform's own /layers.html answers,
          # and keeps showing it when the platform does not. A copy of
          # app/apps/web/assets/3d/, so a sleeping platform cannot blank it.
          mkdir -p _site/3d
          cp pages/3d/*.webp _site/3d/
          # The hero's night-expressway backdrop (1920 and 1080 wide), an
          # original illustration rendered from pages/hero/hero-scene.svg by
          # pages/hero/build-hero.py, and the eight RDD2022 India frames the
          # RAKSHA feed plays, each boxed by the trained model. Web-sized
          # copies, committed like the thumbs; only the .webp files ship.
          mkdir -p _site/hero _site/feed
          cp pages/hero/*.webp _site/hero/
          cp pages/feed/*.webp _site/feed/
          # Space Grotesk, Inter and JetBrains Mono, self-hosted with their SIL OFL licences.
          mkdir -p _site/fonts
          cp pages/fonts/*.woff2 pages/fonts/OFL-*.txt _site/fonts/
          # A custom domain would go here as pages/CNAME, copied into the
          # artefact. It is deliberately absent: setting one BEFORE the
          # domain's DNS points at GitHub makes the working github.io URL
          # 301 to a domain that is still parked, which takes the site down
          # rather than moving it. Point the DNS first, then add the file.
          [ -f pages/CNAME ] && cp pages/CNAME _site/ || true
          cp app/docs/screenshots/*.png _site/shots/
          # The web-sized copies pages/build-thumbs.py makes: the page loads
          # these into tiles and device frames and keeps the untouched PNGs
          # above for the lightbox. Built locally and committed rather than
          # here, so what reviewers saw in the PR is what gets published.
          mkdir -p _site/shots/thumbs _site/shots/stage
          cp app/docs/screenshots/thumbs/*.webp _site/shots/thumbs/
          cp app/docs/screenshots/stage/*.webp  _site/shots/stage/
          # 2560 px copies of the wide captures, offered to retina screens only
          # through srcset; a phone never asks for them.
          mkdir -p _site/shots/hd
          cp app/docs/screenshots/hd/*.webp     _site/shots/hd/
          # One 3D scene per journey stage plus the hero, rendered from the real
          # screenshots by pages/scenes/*.py and committed like the thumbs.
          mkdir -p _site/shots/scene
          cp app/docs/screenshots/scene/*.webp  _site/shots/scene/
          # The two the page embeds, named rather than globbed, so a video
          # added to site/ for some other use is not published by accident.
          cp site/roadassist-app-demo.mp4 _site/media/
          cp site/raksha-full-demo.mp4    _site/media/
          cp site/roadassist-promo.mp4 site/roadassist-promo-vertical.mp4 site/roadassist-promo-poster.png _site/media/
          # The page's own <video poster> is a WebP copy of that PNG (368 KB ->
          # 43 KB), made locally with Pillow (quality 90: at 82 the poster's faint
          # background grid washed out) and committed under pages/media/,
          # because this step has no Pillow. The PNG above still ships for
          # anything that links it.
          cp pages/media/*.webp _site/media/
          # The generated 3D visuals, all of them: naming three by hand meant
          # adding a fourth to the page failed the build instead of shipping.
          # render_visuals.py builds them from the
          # real screenshots above and refuses a landscape capture in a phone
          # frame, which is how the hero silently rendered as overlap once.
          cp ppt/assets/vis_*.png _site/visuals/
          # WebP copies of the visuals the page shows (vis_hero: 712 KB -> 79 KB),
          # committed under pages/visuals/ like the poster's above. The PNGs stay
          # for og:image, the sitemap and the deck. Re-make one after its PNG
          # changes: Image.open(png).convert("RGB").save(webp, "WEBP", quality=82, method=6)
          cp pages/visuals/*.webp _site/visuals/
          # Jekyll would otherwise try to process this and skip _-prefixed files.
          touch _site/.nojekyll

      # The same promise the application makes, checked for the public page:
      # a webfont or a script from somebody else's CDN sends every visitor's
      # IP address abroad, which is what non-negotiable #4 forbids.
      #
      # Three things are NOT third parties and must not fail this: this site's own
      # canonical and og: URLs, which are metadata a browser never fetches; links
      # to the repository on github.com; and the RDD2022 dataset's paper on
      # arxiv.org, the attribution its CC BY-SA licence requires - a link a
      # visitor may follow, never something the page loads.
      - name: No third-party subresource on the public page
        run: |
          offenders=$(grep -nEo '(src|href)="https?://[^"]+' _site/index.html \
            | grep -viE 'github\.com|roadassistbharat\.online|href="https://arxiv\.org/abs/2209\.08538' || true)
          if [ -n "$offenders" ]; then
            echo "$offenders"
            echo "::error::the showcase page loads something from another origin"
            exit 1
          fi
          echo "  clean - every asset is served from this origin"

      - name: Every referenced asset must exist
        run: |
          fail=0
          for ref in $(grep -oE '(src|poster)="[^"h][^"]*"' _site/index.html | cut -d'"' -f2 | sort -u); do
            if [ -f "_site/$ref" ]; then echo "  ok   $ref"; else echo "  MISS $ref"; fail=1; fi
          done
          # Every candidate in every srcset. The grep above only sees src, so a
          # missing hd/ copy would pass it and then break the image on exactly the
          # retina screens it exists for.
          for ref in $(grep -oE 'srcset="[^"]+"' _site/index.html | cut -d'"' -f2 | tr ',' '\n' | awk '{print $1}' | sort -u); do
            if [ -f "_site/$ref" ]; then echo "  ok   $ref (srcset)"; else echo "  MISS $ref (srcset)"; fail=1; fi
          done
          # The gallery's wave builds each card's texture URL in script, from
          # the button's data-src (shots/NAME.png -> shots/thumbs/NAME.webp), so
          # the greps above never see those paths. A renamed screenshot would
          # pass them and then draw a blank card.
          for name in $(grep -oE 'data-src="shots/[^"]+\.png"' _site/index.html | sed -E 's#.*shots/([^"]+)\.png"#\1#' | sort -u); do
            ref="shots/thumbs/$name.webp"
            if [ -f "_site/$ref" ]; then echo "  ok   $ref (wave)"; else echo "  MISS $ref (wave)"; fail=1; fi
            # ...and the full-size PNG the lightbox opens.
            ref="shots/$name.png"
            if [ -f "_site/$ref" ]; then echo "  ok   $ref (lightbox)"; else echo "  MISS $ref (lightbox)"; fail=1; fi
          done
          exit $fail

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
