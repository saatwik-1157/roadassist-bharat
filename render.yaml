# Render blueprint — one web service, one PostGIS database.
#
# Why Render rather than the obvious alternatives: this schema needs PostGIS,
# not plain Postgres. `migrate.ts` runs CREATE EXTENSION postgis, the incidents
# and mechanics tables carry SRID-pinned geometry, and dispatch ranks providers
# with ST_DWithin. A managed Postgres that will not install the extension fails
# on the first migration, which rules out several free tiers that otherwise
# look equivalent.
#
# The API and every web surface ship in ONE container (ADR-0001): the citizen
# app, the mechanic console, the authority dashboard and the map are plain
# files served by Fastify itself, so there is no second service, no CORS
# boundary and no static host to keep in sync.
#
#   Deploy: Render dashboard -> New -> Blueprint -> point it at this repo.
#
# The free web-service plan sleeps after 15 minutes idle and takes roughly a
# minute to wake. That is fine for a demo and NOT fine for the emergency
# claims this platform makes — say so if anyone asks; do not let a sleeping
# free tier be mistaken for the architecture.
services:
  - type: web
    name: roadassist
    runtime: docker
    plan: free
    region: singapore          # closest Render region to India
    dockerfilePath: ./app/Dockerfile
    dockerContext: .           # site/ is outside the npm workspace, served at /media
    healthCheckPath: /health   # answers 503 when the database is unreachable
    # The platform's public name. Render issues the certificate once the CNAME
    # at Hostinger (app -> roadassist-u6ba.onrender.com) resolves.
    domains:
      - app.roadassistbharat.online
    autoDeployTrigger: commit

    # Migrate on boot. migrate.ts is idempotent by design - it applies the
    # journal, pins SRIDs, rebuilds the GiST indexes and re-asserts the
    # append-only audit RULES, all of which are safe to repeat - so a restart
    # costs a second and a first deploy needs no separate step. It does NOT
    # run the full seed: that needs @faker-js/faker, which is a devDependency
    # and is deliberately absent here. See DEPLOYMENT.md for seeding the demo
    # once. The one boot-time seed is the small demo fleet (SEED_DEMO_FLEET).
    dockerCommand: ./docker-start.sh

    envVars:
      # NOT "production". The production guard in env.ts refuses to boot
      # without a real payment gateway, a real SMS provider and webhook
      # secrets — which is correct, and which a demo cannot satisfy. Running
      # as "demo" keeps that guard meaningful instead of weakening it.
      - key: NODE_ENV
        value: demo
      - key: PORT
        value: 8080
      - key: HOST
        value: 0.0.0.0

      # Set in the Render dashboard, not here: Render allows exactly one free
      # PostgreSQL per account and this account's is already in use by another
      # project, so the database lives on Neon instead. Neon's free tier does
      # support PostGIS, which this schema requires - run
      # `CREATE EXTENSION postgis;` there once before the first deploy, because
      # migrate.ts needs rights the pooled role may not have.
      #
      # Use Neon's DIRECT connection string, not the pooled one: the pooler
      # does not keep session state, and migrations and the SSE streams both
      # want a real session.
      - key: DATABASE_URL
        sync: false

      # Generated once by Render and then fixed. Never commit one.
      - key: JWT_SECRET
        generateValue: true

      # Render terminates TLS at its own proxy, so without this every request
      # appears to come from the proxy — and the per-IP OTP limiter would
      # throttle every user in the world as if they were one client.
      - key: TRUST_PROXY
        value: "true"

      # The surfaces are served by this very process, so they are same-origin.
      # The one cross-origin caller is the showcase at roadassistbharat.online,
      # whose live view reads /health before it frames the platform - refused,
      # it would show screenshots forever. Listed explicitly, because an unset
      # value reflects any Origin.
      - key: CORS_ORIGINS
        value: https://roadassistbharat.online,https://app.roadassistbharat.online

      # A demo has no SMS route and no payment gateway, and the platform says
      # so on screen rather than pretending (non-negotiable #5).
      - key: SMS_PROVIDER
        value: console
      - key: PAYMENTS_PROVIDER
        value: mock

      # 24 SIMULATED mechanics on the Gurugram / NH-48 corridor, added on boot
      # by docker-start.sh (+919600000000 ... +919600000023, partner "Demo Fleet
      # (simulated)"). Without them every dispatch on this demo ends in
      # NO_SUPPLY. Idempotent, so every restart after the first is a no-op; a
      # failure is logged and the API starts anyway; and the script refuses
      # NODE_ENV=production, so copying this line to a live service adds nobody.
      - key: SEED_DEMO_FLEET
        value: "true"

      # DELIBERATE, and the one setting to think about before sharing the URL:
      # with no SMS provider, this returns the OTP in the response so anyone
      # can sign in — including as the seeded authority account. That is what
      # makes the demo usable and it is also an open door. Set it to false and
      # the deployment becomes unusable without a real SMS provider.
      - key: EXPOSE_DEV_OTP
        value: "true"

      # Hazard-report photos land here. On the free plan this is EPHEMERAL:
      # Render's persistent disks need a paid instance type, so an upload does
      # not survive a restart or a redeploy. ADR-0006 keeps only a reference in
      # the database, so the row outlives the file and the photo endpoint 404s
      # rather than corrupting anything - but say "photos are not durable on
      # this tier" rather than letting someone assume they are.
      #
      # To make them durable: move to a paid instance type and restore the
      # disk block that used to sit here -
      #   disk: { name: uploads, mountPath: /repo/app/var, sizeGB: 1 }
      - key: UPLOAD_DIR
        value: /repo/app/var/uploads

      # Operator alerts (apps/api/src/alerts.ts): sign-ins, first sign-ins,
      # confirmed and off-grid SOS, wrong-code bursts and admin sign-ins, emailed
      # to the owner. Sent from the SERVER through Resend, so the key never
      # reaches a browser; each email carries a masked number, a role, an event
      # and a time - never a name, position, IP or device. Resend's free plan
      # sends from onboarding@resend.dev to the account's own address, which is
      # exactly this use. Both values below are set by hand in the dashboard;
      # with ALERT_EMAIL_TO empty, alerts are off and the boot log says so.
      # ALERT_EMAIL_TO may be a comma-separated list; anyone but the Resend
      # account's own address needs a verified domain and an EMAIL_FROM on it.
      - key: EMAIL_PROVIDER
        value: http
      - key: EMAIL_BASE_URL
        value: https://api.resend.com/emails
      - key: EMAIL_FROM
        value: RoadAssist Alerts <onboarding@resend.dev>
      - key: EMAIL_API_KEY
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
      - key: ALERT_LABEL
        value: roadassist on Render

      # Email sign-in (apps/api/src/domain/email-signin.ts): "email=+91XXXXXXXXXX"
      # pairs, comma-separated, set by hand. Each listed account signs in with a
      # code emailed through the provider above, never shown on screen, and its
      # number stops accepting the on-screen demo code. Empty = phone only.
      - key: EMAIL_SIGNIN
        sync: false
