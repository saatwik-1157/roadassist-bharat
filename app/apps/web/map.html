<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>RoadAssist — Live Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin="">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #map { height: 100%; width: 100%; background: #0a0a0a; }
  #map { font-family: system-ui, sans-serif; }
  .leaflet-container { background: #141414; }
  .badge { position: absolute; top: 10px; left: 10px; z-index: 1000;
    background: rgba(10,10,10,0.82); color: #f4f2ec; border: 1px solid rgba(227,185,106,0.3);
    border-radius: 10px; padding: 8px 12px; font-size: 12px; line-height: 1.6; backdrop-filter: blur(6px); }
  .badge b { color: #e3b96a; }
  .legend { position: absolute; bottom: 14px; left: 10px; z-index: 1000;
    background: rgba(10,10,10,0.82); color: #cfc8ba; border: 1px solid rgba(227,185,106,0.25);
    border-radius: 10px; padding: 8px 12px; font-size: 11px; line-height: 1.9; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 7px; vertical-align: -1px; }
  .me { width: 16px; height: 16px; border-radius: 50%; background: #4aa3ff;
    border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(74,163,255,0.3); }
  .pin { width: 100%; height: 100%; border-radius: 50%;
    box-shadow: inset -2px -3px 4px rgba(0,0,0,0.4), inset 1px 2px 3px rgba(255,255,255,0.5), 0 2px 6px rgba(0,0,0,0.6); }
  /* Gold cluster bubble (Apple-Maps-style count) */
  .cl { display: flex; align-items: center; justify-content: center;
    border-radius: 50%; color: #0a0805; font: 600 12px/1 system-ui, sans-serif;
    background: radial-gradient(circle at 34% 30%, #fff, #e3b96a 62%, #a8813f);
    box-shadow: 0 0 0 4px rgba(227,185,106,0.28), 0 2px 8px rgba(0,0,0,0.5); }
  /* "Request assistance" button inside a mechanic popup */
  .rabook { margin-top: 8px; width: 100%; border: 0; cursor: pointer;
    background: #e3b96a; color: #0a0805; font: 600 12px system-ui, sans-serif;
    padding: 8px 10px; border-radius: 8px; letter-spacing: 0.4px; }
  .leaflet-popup-content { margin: 12px 14px; font: 13px/1.5 system-ui, sans-serif; }
  /* locate-me control */
  .locate { position: absolute; right: 10px; bottom: 44px; z-index: 1000;
    width: 44px; height: 44px; background: rgba(10,10,10,0.85);
    border: 1px solid rgba(227,185,106,0.4); border-radius: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 20px;
    color: #e3b96a; backdrop-filter: blur(6px); }
</style>
</head>
<body>
<div id="map"></div>
<div class="badge" id="badge">Loading live map…</div>
<div class="legend">
  <div><span class="dot" style="background:#e3b96a"></span>Verified mechanic</div>
  <div><span class="dot" style="background:#4aa3ff"></span>Responder unit</div>
  <div><span class="dot" style="background:#ff9f43"></span>Road detection</div>
</div>
<div class="locate" id="locate" onclick="__locate()" title="Locate me">◎</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" crossorigin=""></script>
<script>
(function () {
  "use strict";
  // The Android app passes the base + token in the URL hash (not sent to server
  // logs). Falls back to same-origin for browser testing.
  var hash = new URLSearchParams(location.hash.slice(1));
  var BASE = hash.get("base") || location.origin;
  var TOKEN = hash.get("token") || "";
  // In the Android app a JS bridge hands us a always-current token and can
  // silently rotate it — so the map self-heals instead of showing "expired".
  function authToken() {
    try { if (window.AndroidAuth && AndroidAuth.token) return AndroidAuth.token() || TOKEN; } catch (e) {}
    return TOKEN;
  }
  function tryRefresh() {
    try { if (window.AndroidAuth && AndroidAuth.refresh) return !!AndroidAuth.refresh(); } catch (e) {}
    return false;
  }
  var esc = function (v) { return String(v == null ? "" : v).replace(/[&<>"']/g,
    function (c) { return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]; }); };

  // India bounds — open on the whole country (Apple-Maps-style), then let the
  // user zoom right down to the street.
  var INDIA = [[6.5, 68.0], [35.7, 97.5]];
  var center = [28.4595, 77.0266];   // used for the live-data query & "locate me"
  // preferCanvas: the 200+ detection markers render on one canvas instead of
  // one SVG/DOM node each — panning and zooming stay smooth.
  var map = L.map("map", {
    zoomControl: true, minZoom: 4, maxZoom: 17,
    preferCanvas: true, zoomAnimation: true, fadeAnimation: true,
    wheelPxPerZoomLevel: 90, zoomSnap: 0.25,
  });
  map.fitBounds(INDIA);
  // Clean CARTO Voyager basemap via the platform's proxy (polite UA + cache).
  // updateWhenIdle / no-update-while-zooming = fewer tile churns per gesture.
  L.tileLayer(BASE + "/basemap/{z}/{x}/{y}.png", {
    minZoom: 4, maxZoom: 17, attribution: "© OpenStreetMap © CARTO",
    updateWhenIdle: true, updateWhenZooming: false, keepBuffer: 4,
    crossOrigin: true,
  }).addTo(map);
  // One shared canvas renderer for the circle detections.
  var canvas = L.canvas({ padding: 0.5 });
  var layer = L.layerGroup().addTo(map);   // detections (canvas circles)
  // Verified mechanics + responders cluster into Apple-Maps-style count bubbles
  // when they overlap; they separate as you zoom in.
  var cluster = L.markerClusterGroup({
    maxClusterRadius: 55, showCoverageOnHover: false, spiderfyOnMaxZoom: true,
    iconCreateFunction: function (c) {
      var n = c.getChildCount();
      var s = n < 10 ? 34 : n < 50 ? 42 : 50;
      return L.divIcon({ html: '<div class="cl" style="width:' + s + 'px;height:' + s + 'px">' + n + '</div>',
        className: "", iconSize: [s, s] });
    },
  }).addTo(map);
  var meMarker = null;
  var mechById = {};   // id → {name, lat, lng} so a popup button can book it

  // Tap "Request assistance" in a mechanic popup → hand off to the app to book
  // that specific mechanic (falls back to a no-op outside the Android shell).
  window.raBook = function (id) {
    var m = mechById[id]; if (!m) return;
    try {
      if (window.AndroidNav && AndroidNav.book) { AndroidNav.book(id, m.name, m.lat, m.lng); return; }
    } catch (e) {}
    alert("Open the app to request assistance from " + m.name);
  };
  // Force the next refresh to redraw (used after a citizen submits a report).
  window.__refresh = function () { lastSig = ""; load(); };
  // "Locate me" — fly to the device position (asking for it if needed).
  window.__locate = function () {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(function (p) {
      center = [p.coords.latitude, p.coords.longitude];
      if (meMarker) map.removeLayer(meMarker);
      meMarker = L.marker(center, { icon: L.divIcon({ className: "", html: '<div class="me"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }) }).addTo(map);
      map.flyTo(center, 14, { duration: 0.8 });
    }, function () {}, { enableHighAccuracy: true, timeout: 6000 });
  };

  // In an Android WebView the map often initializes before the view has its
  // final size, leaving tiles unpainted — nudge Leaflet to re-measure.
  function fix() { map.invalidateSize(true); }
  setTimeout(fix, 300); setTimeout(fix, 900); setTimeout(fix, 1800);
  window.addEventListener("load", fix);
  window.addEventListener("resize", fix);

  function icon(color, glow, size) {
    return L.divIcon({ className: "",
      html: '<div class="pin" style="background:radial-gradient(circle at 34% 30%,#fff,' + color + ' 60%,' +
        'color-mix(in srgb,' + color + ' 55%,#000));box-shadow:inset -2px -3px 4px rgba(0,0,0,.4),' +
        '0 0 10px ' + glow + '"></div>',
      iconSize: [size, size], iconAnchor: [size / 2, size / 2] });
  }
  var SEV = { 1:"#3ddc97",2:"#3ddc97",3:"#ffd166",4:"#ff9f43",5:"#ff4d5a" };

  var lastSig = "";   // redraw only when the payload actually changes — no 10s blink
  async function load() {
    try {
      // Query from the country's centre with a nation-wide radius so all the
      // seeded cities (Delhi-NCR, Hyderabad, Pune, Jaipur, Bhopal, Coimbatore,
      // Vijayawada, Guwahati) appear on the India map.
      var url = BASE + "/v1/map/live?lat=22.6&lng=80.0&radiusKm=2500";
      var tok = authToken();
      var res = await fetch(url, { headers: tok ? { authorization: "Bearer " + tok } : {} });
      // On expiry, ask the app to rotate the token once, then retry silently.
      if (res.status === 401 && tryRefresh()) {
        tok = authToken();
        res = await fetch(url, { headers: tok ? { authorization: "Bearer " + tok } : {} });
      }
      var j = await res.json();
      if (!res.ok) { document.getElementById("badge").innerHTML = "⚠ " + esc((j.error && j.error.title) || res.status); return; }
      var d = j.data;

      // Cheap fingerprint of the data (counts + a couple of sampled rows); if
      // nothing changed, leave the markers untouched so the map never flickers.
      function samp(a) { var f = a[0] || {}, l = a[a.length - 1] || {};
        return (f.lat || "") + "," + (f.lng || "") + "|" + (l.lat || "") + "," + (l.lng || "") + "," + (l.severity || l.status || ""); }
      var sig = d.mechanics.length + ":" + d.responders.length + ":" + d.detections.length +
        "#" + samp(d.mechanics) + "#" + samp(d.detections);
      if (sig === lastSig) return;
      lastSig = sig;

      // The signature guard above means we only reach here when data actually
      // changed, so a direct rebuild never causes a periodic blink.
      layer.clearLayers();
      cluster.clearLayers();
      mechById = {};
      d.mechanics.forEach(function (m) {
        if (m.lat == null) return;
        mechById[m.id] = { name: m.display_name, lat: m.lat, lng: m.lng };
        L.marker([m.lat, m.lng], { icon: icon("#e3b96a", "rgba(227,185,106,.6)", 18) })
          .bindPopup("<b>" + esc(m.display_name) + "</b><br>★ " + m.rating + " · " + m.km + " km away" +
            '<button class="rabook" onclick="raBook(\'' + esc(m.id) + '\')">Request assistance</button>')
          .addTo(cluster);
      });
      d.responders.forEach(function (r) {
        if (r.lat == null) return;
        L.marker([r.lat, r.lng], { icon: icon("#4aa3ff", "rgba(74,163,255,.6)", 20) })
          .bindPopup("<b>" + esc(r.name) + "</b><br>" + esc(r.kind)).addTo(cluster);
      });
      d.detections.forEach(function (x) {
        if (x.lat == null) return;
        var c = SEV[x.severity] || "#ff9f43";
        L.circleMarker([x.lat, x.lng], { renderer: canvas, radius: 6, color: c, fillColor: c, fillOpacity: 0.8, weight: 1 })
          .bindPopup("<b>" + esc(x.detection_type) + "</b> · severity " + esc(x.severity) + "<br>" + esc(x.status))
          .addTo(layer);
      });
      document.getElementById("badge").innerHTML =
        "<b>" + d.mechanics.length + "</b> mechanics · <b>" + d.responders.length + "</b> responders · <b>" +
        d.detections.length + "</b> detections<br><span style='color:#8f948f'>live · auto-refresh</span>";
    } catch (e) {
      document.getElementById("badge").innerHTML = "⚠ " + esc(e.message);
    }
  }

  // Keep the whole-India view on open (Apple-Maps style). If the device grants
  // location, drop a "you are here" dot without disturbing the country-wide view
  // — the user can pinch straight to their spot.
  load();
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function (p) {
      center = [p.coords.latitude, p.coords.longitude];
      if (meMarker) map.removeLayer(meMarker);
      meMarker = L.marker(center, { icon: L.divIcon({ className: "", html: '<div class="me"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }) }).addTo(map);
    }, function () {}, { timeout: 5000 });
  }

  setInterval(function () { if (!document.hidden) load(); }, 15000);
})();
</script>
</body>
</html>
