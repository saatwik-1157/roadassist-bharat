<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>RoadAssist — Live Map</title>
<!-- Theme boot. Shares the key the web app writes, so an embedded map matches
     the shell around it. The native shell has no such storage, so it passes the
     theme in the hash instead — that wins when present. -->
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem("ra.theme"); } catch (e) { /* storage blocked */ }
    var h = new URLSearchParams(location.hash.slice(1)).get("theme");
    if (h === "dark" || h === "light") t = h;
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<!-- Leaflet + markercluster are bundled locally (served by the API) rather than
     pulled from a CDN — no third-party dependency, and the map keeps working on
     restricted networks where unpkg is blocked or unreachable. -->
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/MarkerCluster.css">
<link rel="stylesheet" href="ds.css">
<style>
  html, body, #map { height: 100%; width: 100%; background: var(--bg); }
  #map { font-family: var(--sans); }
  .leaflet-container { background: var(--surface-2); font-family: var(--sans); }
  /* Dark basemap without an API key: invert the tiles and spin the hue back so
     water stays blue-ish and land stays neutral. Only the tile pane is
     filtered — markers, popups and controls keep their real colours. */
  .map-dark .leaflet-tile-pane {
    filter: invert(1) hue-rotate(180deg) brightness(0.92) contrast(0.88) saturate(0.75);
  }

  /* Floating glass furniture, consistent with the app shell. */
  .panel {
    position: absolute; z-index: 1000; border-radius: var(--r-md);
    background: var(--glass-strong); border: 1px solid var(--line);
    backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6);
    box-shadow: var(--shadow-2); color: var(--text);
  }
  .badge { top: 12px; left: 12px; padding: 10px 14px; font-size: 12.5px; line-height: 1.6; }
  .badge .num { font-size: 14px; font-weight: 700; color: var(--brand); }
  .badge .foot { display: block; color: var(--text-3); font-size: 11px; margin-top: 3px; }

  .legend { bottom: 14px; left: 12px; padding: 10px 13px; font-size: 11.5px; line-height: 1.95; color: var(--text-2); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; vertical-align: 0; }

  .ctrl {
    right: 12px; width: 42px; height: 42px; display: grid; place-items: center;
    cursor: pointer; color: var(--text-2);
    transition: color var(--t-2) var(--ease), transform var(--t-3) var(--spring);
    -webkit-tap-highlight-color: transparent;
  }
  .ctrl:hover  { color: var(--brand); }
  .ctrl:active { transform: scale(0.9); }
  .ctrl svg { width: 19px; height: 19px; }
  #locate { bottom: 76px; }
  #themeBtn { bottom: 24px; }

  /* "You are here" */
  .me {
    width: 16px; height: 16px; border-radius: 50%; background: var(--blue);
    border: 3px solid var(--surface); box-shadow: 0 0 0 6px var(--blue-soft), var(--shadow-1);
  }
  .pin {
    width: 100%; height: 100%; border-radius: 50%;
    box-shadow: inset -2px -3px 4px rgba(0,0,0,0.35), inset 1px 2px 3px rgba(255,255,255,0.45), var(--shadow-1);
  }
  /* Cluster count bubble */
  .cl {
    display: flex; align-items: center; justify-content: center; border-radius: 50%;
    color: var(--brand-ink); font: 700 12px/1 var(--sans);
    background: radial-gradient(circle at 34% 30%, #fff, #e3b96a 62%, #a8813f);
    box-shadow: 0 0 0 4px rgba(227,185,106,0.26), var(--shadow-2);
  }

  /* Leaflet chrome, restyled onto the token palette. */
  .leaflet-popup-content-wrapper, .leaflet-popup-tip {
    background: var(--surface); color: var(--text);
    box-shadow: var(--shadow-3); border: 1px solid var(--line);
  }
  .leaflet-popup-content-wrapper { border-radius: var(--r-md); }
  .leaflet-popup-content { margin: 13px 15px; font: 13px/1.55 var(--sans); }
  .leaflet-popup-close-button { color: var(--text-3) !important; }
  .leaflet-bar a {
    background: var(--surface); color: var(--text-2); border-bottom-color: var(--line);
  }
  .leaflet-bar a:hover { background: var(--surface-2); color: var(--text); }
  .leaflet-control-attribution {
    background: var(--glass) !important; color: var(--text-3);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .leaflet-control-attribution a { color: var(--text-2); }

  .rabook {
    margin-top: 10px; width: 100%; border: 0; cursor: pointer;
    background: var(--ink); color: var(--ink-on); font: 650 12.5px var(--sans);
    padding: 9px 10px; border-radius: var(--r-full);
    transition: transform var(--t-2) var(--spring), filter var(--t-1) linear;
  }
  .rabook:hover  { filter: brightness(1.08); }
  .rabook:active { transform: scale(0.96); }
</style>
</head>
<body>
<div id="map"></div>

<div class="panel badge" id="badge">Loading live map…</div>

<div class="panel legend">
  <div><span class="dot" style="background:#e3b96a"></span>Verified mechanic</div>
  <div><span class="dot" style="background:#4aa3ff"></span>Responder unit</div>
  <div><span class="dot" style="background:#ff9f43"></span>Road detection · location simulated</div>
  <div><span class="dot" style="background:#ff9f43;box-shadow:0 0 0 2px #fff"></span>Citizen report · phone GPS</div>
</div>

<button class="panel ctrl" id="locate" title="Locate me" aria-label="Locate me">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
    <circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="8"/><path d="M12 1.6v2.6m0 15.6v2.6M22.4 12h-2.6M4.2 12H1.6"/>
  </svg>
</button>
<button class="panel ctrl theme-btn" id="themeBtn" title="Switch theme" aria-label="Switch colour theme"
        style="border-radius:var(--r-md);background:var(--glass-strong)">
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
</button>

<script src="vendor/leaflet.js"></script>
<script src="vendor/markercluster.js"></script>
<script>
(function () {
  "use strict";
  // The Android app passes the base + token in the URL hash (not sent to server
  // logs). Falls back to same-origin for browser testing.
  var hash = new URLSearchParams(location.hash.slice(1));
  // An explicit ?base= wins; otherwise the same fallback as app.html.
  var BASE = hash.get("base") || (function () {
    var http = location.protocol === "http:" || location.protocol === "https:";
    if (!http) return "http://localhost:4000";
    var local = location.hostname === "localhost" || location.hostname === "127.0.0.1";
    if (local && location.port !== "4000") return "http://localhost:4000";
    return location.origin;
  })();
  var TOKEN = hash.get("token") || "";
  // In the Android app a JS bridge hands us an always-current token and can
  // silently rotate it — so the map self-heals instead of showing "expired".
  function authToken() {
    try { if (window.AndroidAuth && AndroidAuth.token) return AndroidAuth.token() || TOKEN; } catch (e) {}
    return TOKEN || sessionToken();
  }
  // Opened in a browser there is no app to hand over a token, so the map
  // answered every load with "Unauthorized" and showed an empty India. It now
  // uses the session of whichever surface you signed in to on this origin -
  // the same token that page already holds, so this grants nothing a signed-in
  // user did not have. With no session it still gets nothing, and says so.
  var SESSION_KEYS = ["ra.raksha.session", "ra.mechanic.session", "ra.app.session"];
  function sessionToken() {
    for (var i = 0; i < SESSION_KEYS.length; i++) {
      try {
        var s = JSON.parse(localStorage.getItem(SESSION_KEYS[i]) || "null");
        if (s && typeof s.token === "string" && s.token) return s.token;
      } catch (e) { /* storage blocked or corrupt - try the next one */ }
    }
    return "";
  }
  function tryRefresh() {
    try { if (window.AndroidAuth && AndroidAuth.refresh) return !!AndroidAuth.refresh(); } catch (e) {}
    return false;
  }
  var esc = function (v) { return String(v == null ? "" : v).replace(/[&<>"']/g,
    function (c) { return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]; }); };

  // ── theme ────────────────────────────────────────────────────────────────
  function isDark() {
    var explicit = document.documentElement.getAttribute("data-theme");
    if (explicit) return explicit === "dark";
    return matchMedia("(prefers-color-scheme: dark)").matches;
  }

  // India bounds — open on the whole country (Apple-Maps-style), then let the
  // user zoom right down to the street.
  var INDIA = [[6.5, 68.0], [35.7, 97.5]];
  var center = [28.4595, 77.0266];   // used for the live-data query & "locate me"
  // preferCanvas: the 200+ detection markers render on one canvas instead of
  // one SVG/DOM node each — panning and zooming stay smooth.
  var map = L.map("map", {
    // The status badge owns the top-left corner, where Leaflet puts zoom by
    // default — the badge sat on top of the + button.
    zoomControl: false, minZoom: 4, maxZoom: 17,
    preferCanvas: true, zoomAnimation: true, fadeAnimation: true,
    wheelPxPerZoomLevel: 90, zoomSnap: 0.25,
  });
  L.control.zoom({ position: "topright" }).addTo(map);
  map.fitBounds(INDIA);

  // Keyless OSM basemap via the platform's proxy (polite UA + cache).
  // updateWhenIdle / no-update-while-zooming = fewer tile churns per gesture.
  L.tileLayer(BASE + "/basemap/{z}/{x}/{y}.png", {
    minZoom: 4, maxZoom: 17, attribution: "© OpenStreetMap contributors",
    updateWhenIdle: true, updateWhenZooming: false, keepBuffer: 4, crossOrigin: true,
  }).addTo(map);

  // One keyless tile source serves both themes; dark is a filter over the tile
  // pane. Swapping to a dark tile provider would mean an API key, and the
  // keyless ones stamp a watermark across every tile.
  function paintBasemap() {
    document.documentElement.classList.toggle("map-dark", isDark());
  }
  paintBasemap();

  // Follow the system when the user has expressed no preference of their own.
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
    if (!document.documentElement.getAttribute("data-theme")) paintBasemap();
  });

  document.getElementById("themeBtn").onclick = function () {
    setTheme(isDark() ? "light" : "dark");
    try { localStorage.setItem("ra.theme", isDark() ? "dark" : "light"); } catch (e) { /* per-page only */ }
  };

  /** Called by the native shell when the app's own theme toggle flips. */
  function setTheme(mode) {
    document.documentElement.setAttribute("data-theme", mode);
    paintBasemap();
  }
  window.__setTheme = setTheme;
  // The native shell hides its own theme control's twin — it already has one.
  if (window.AndroidAuth) document.getElementById("themeBtn").hidden = true;

  // One shared canvas renderer for the circle detections.
  var canvas = L.canvas({ padding: 0.5 });
  var layer = L.layerGroup().addTo(map);   // detections (canvas circles)
  // Verified mechanics + responders cluster into count bubbles when they
  // overlap; they separate as you zoom in.
  var cluster = L.markerClusterGroup({
    maxClusterRadius: 55, showCoverageOnHover: false, spiderfyOnMaxZoom: true,
    iconCreateFunction: function (c) {
      var n = c.getChildCount();
      var s = n < 10 ? 34 : n < 50 ? 42 : 50;
      return L.divIcon({ html: '<div class="cl" style="width:' + s + 'px;height:' + s + 'px">' + n + '</div>',
        className: "", iconSize: [s, s] });
    },
  }).addTo(map);
  var meMarker = null;
  var mechById = {};   // id → {name, lat, lng} so a popup button can book it

  // Tap "Request assistance" in a mechanic popup → hand off to the app to book
  // that specific mechanic (falls back to a no-op outside the Android shell).
  window.raBook = function (id) {
    var m = mechById[id]; if (!m) return;
    try {
      if (window.AndroidNav && AndroidNav.book) { AndroidNav.book(id, m.name, m.lat, m.lng); return; }
    } catch (e) {}
    // Outside the native shell, tell the embedding page instead of blocking the
    // WebView with a modal dialog.
    try { parent.postMessage({ type: "ra.book", mechanicId: id, name: m.name }, location.origin); } catch (e) {}
  };
  // Force the next refresh to redraw (used after a citizen submits a report).
  window.__refresh = function () { lastSig = ""; load(); };
  // "Locate me" — fly to the device position (asking for it if needed).
  window.__locate = function () {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(function (p) {
      center = [p.coords.latitude, p.coords.longitude];
      dropMe();
      map.flyTo(center, 14, { duration: 0.8 });
    }, function () {}, { enableHighAccuracy: true, timeout: 6000 });
  };
  document.getElementById("locate").onclick = window.__locate;

  function dropMe() {
    if (meMarker) map.removeLayer(meMarker);
    meMarker = L.marker(center, { icon: L.divIcon({
      className: "", html: '<div class="me"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }) }).addTo(map);
  }

  // In an Android WebView the map often initializes before the view has its
  // final size, leaving tiles unpainted — nudge Leaflet to re-measure.
  function fix() { map.invalidateSize(true); }
  setTimeout(fix, 300); setTimeout(fix, 900); setTimeout(fix, 1800);
  window.addEventListener("load", fix);
  window.addEventListener("resize", fix);

  function icon(color, glow, size) {
    return L.divIcon({ className: "",
      html: '<div class="pin" style="background:radial-gradient(circle at 34% 30%,#fff,' + color + ' 60%,' +
        'color-mix(in srgb,' + color + ' 55%,#000));box-shadow:inset -2px -3px 4px rgba(0,0,0,.4),' +
        '0 0 10px ' + glow + '"></div>',
      iconSize: [size, size], iconAnchor: [size / 2, size / 2] });
  }
  var SEV = { 1:"#3ddc97",2:"#3ddc97",3:"#ffd166",4:"#ff9f43",5:"#ff4d5a" };

  var lastSig = "";   // redraw only when the payload actually changes — no 10s blink

  /* ── offline map support (ADR-0009) ───────────────────────────────────────
     Every successful load is cached. When a load fails, the last cache is drawn
     instead of an error — and the badge says, in words, that what is on screen
     is a snapshot with a timestamp rather than live data. What it must never do
     is present stale mechanic pins as live positions or invent an ETA. */
  var OGStore = null;
  var SNAPSHOT_KEY = "map.national";
  // The same on-device store the app uses, so a cached map is one mechanism
  // rather than two. Imported dynamically from this classic script: a separate
  // module <script> would be deferred and arrive after this file has run.
  import("./offline-store.js").then(async function (m) {
    if (!m.available()) return;
    await m.open();
    OGStore = m;
  }).catch(function () { /* no cache this session — the map still loads live */ });

  function offlineBadge(at, counts) {
    return "⛰ <b>OFFLINE MAP</b> — LAST UPDATED " +
      esc(new Date(at).toLocaleString()).toUpperCase() +
      "<span class='foot'>" + counts + " · snapshot, not live</span>";
  }

  async function load() {
    try {
      // Query from the country's centre with a nation-wide radius so all the
      // seeded cities (Delhi-NCR, Hyderabad, Pune, Jaipur, Bhopal, Coimbatore,
      // Vijayawada, Guwahati) appear on the India map.
      var url = BASE + "/v1/map/live?lat=22.6&lng=80.0&radiusKm=2500";
      var tok = authToken();
      var res = await fetch(url, { headers: tok ? { authorization: "Bearer " + tok } : {} });
      // On expiry, ask the app to rotate the token once, then retry silently.
      if (res.status === 401 && tryRefresh()) {
        tok = authToken();
        res = await fetch(url, { headers: tok ? { authorization: "Bearer " + tok } : {} });
      }
      var j = await res.json();
      if (!res.ok) {
        var why = (j.error && j.error.title) || res.status;
        // A bare "Unauthorized" tells a visitor nothing they can act on.
        if (res.status === 401) {
          why = tok ? "Your session has expired - sign in again on the citizen app, mechanic console or RAKSHA"
                    : "Sign in on the citizen app, mechanic console or RAKSHA in this browser to see the live map";
        }
        document.getElementById("badge").innerHTML = "⚠ " + esc(why);
        return;
      }
      var d = j.data;
      draw(d, null);
      if (OGStore) {
        OGStore.putSnapshot(SNAPSHOT_KEY, {
          mechanics: (d.mechanics || []).slice(0, 200),
          responders: (d.responders || []).slice(0, 60),
          detections: (d.detections || []).slice(0, 300),
        }).catch(function () { /* cache is best-effort */ });
      }
    } catch (e) {
      // The request never got out. Fall back to the last snapshot rather than
      // to an error message — a map from an hour ago is genuinely useful, and
      // saying so is what keeps it honest.
      await drawFromCache(e);
    }
  }

  async function drawFromCache(cause) {
    var badge = document.getElementById("badge");
    if (!OGStore) {
      badge.innerHTML = "⚠ " + esc((cause && cause.message) || "offline") + " — nothing cached on this device";
      return;
    }
    var snap = await OGStore.getSnapshot(SNAPSHOT_KEY).catch(function () { return null; });
    if (!snap) {
      badge.innerHTML = "⛰ <b>OFFLINE</b> — no snapshot has been cached on this device yet";
      return;
    }
    lastSig = "";                     // force a redraw when live data returns
    draw(snap.data, snap.at);
  }

  function draw(d, snapshotAt) {
      // Cheap fingerprint of the data (counts + a couple of sampled rows); if
      // nothing changed, leave the markers untouched so the map never flickers.
      function samp(a) { var f = a[0] || {}, l = a[a.length - 1] || {};
        return (f.lat || "") + "," + (f.lng || "") + "|" + (l.lat || "") + "," + (l.lng || "") + "," + (l.severity || l.status || ""); }
      var sig = (snapshotAt ? "snap:" : "live:") +
        d.mechanics.length + ":" + d.responders.length + ":" + d.detections.length +
        "#" + samp(d.mechanics) + "#" + samp(d.detections);
      if (sig === lastSig) return;
      lastSig = sig;

      // The signature guard above means we only reach here when data actually
      // changed, so a direct rebuild never causes a periodic blink.
      layer.clearLayers();
      cluster.clearLayers();
      mechById = {};
      d.mechanics.forEach(function (m) {
        if (m.lat == null) return;
        mechById[m.id] = { name: m.display_name, lat: m.lat, lng: m.lng };
        L.marker([m.lat, m.lng], { icon: icon("#e3b96a", "rgba(227,185,106,.6)", 18) })
          .bindPopup("<b>" + esc(m.display_name) + "</b><br>★ " + esc(m.rating) + " · " + esc(m.km) + " km away" +
            '<button class="rabook" onclick="raBook(\'' + esc(m.id) + '\')">Request assistance</button>')
          .addTo(cluster);
      });
      d.responders.forEach(function (r) {
        if (r.lat == null) return;
        L.marker([r.lat, r.lng], { icon: icon("#4aa3ff", "rgba(74,163,255,.6)", 20) })
          .bindPopup("<b>" + esc(r.name) + "</b><br>" + esc(r.kind)).addTo(cluster);
      });
      d.detections.forEach(function (x) {
        if (x.lat == null) return;
        var c = SEV[x.severity] || "#ff9f43";
        // Citizen-reported hazards get a white ring so they read differently
        // from autonomous edge-device sightings.
        var cit = x.source === "citizen";
        var src = cit ? "<span style='color:var(--brand)'>◉ Citizen report</span>"
                      : "<span style='color:var(--text-3)'>Edge device</span>";
        L.circleMarker([x.lat, x.lng], {
          renderer: canvas, radius: cit ? 7 : 6,
          color: cit ? "#ffffff" : c, fillColor: c, fillOpacity: 0.85, weight: cit ? 2.5 : 1,
        })
          .bindPopup("<b>" + esc(String(x.detection_type).replace(/_/g, " ")) + "</b> · severity " + esc(x.severity) +
            "<br>" + esc(x.status) + "<br>" + src +
            // Where the point came from, in the API's own words: a phone's
            // measured fix, or a SIMULATED placement. Absent on an old snapshot.
            (x.position_label ? "<br><small>" + esc(x.position_label) +
              (x.created_at ? " · " + esc(new Date(x.created_at).toLocaleString()) : "") + "</small>" : ""))
          .addTo(layer);
      });
      var counts = d.mechanics.length + " mechanics · " + d.responders.length +
        " responders · " + d.detections.length + " detections";
      document.getElementById("badge").innerHTML = snapshotAt
        ? offlineBadge(snapshotAt, counts)
        : "<span class='num'>" + d.mechanics.length + "</span> mechanics · " +
          "<span class='num'>" + d.responders.length + "</span> responders · " +
          "<span class='num'>" + d.detections.length + "</span> detections" +
          "<span class='foot'>live · auto-refresh</span>";
  }

  // Keep the whole-India view on open. If the device grants location, drop a
  // "you are here" dot without disturbing the country-wide view — the user can
  // pinch straight to their spot.
  load();
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function (p) {
      center = [p.coords.latitude, p.coords.longitude];
      dropMe();
    }, function () {}, { timeout: 5000 });
  }

  setInterval(function () { if (!document.hidden) load(); }, 15000);
  // Signing in on another tab or frame of this origin shows up here at once,
  // rather than on the next 15-second tick.
  window.addEventListener("storage", function (e) {
    if (e.key && SESSION_KEYS.indexOf(e.key) !== -1) { lastSig = ""; load(); }
  });
})();
</script>
</body>
</html>
