# Local cloud-infrastructure stand-in for RoadAssist.
# Mirrors the managed services we consume in production:
#   postgis  -> managed PostgreSQL + PostGIS   (IaaS/PaaS data tier)
#   redis    -> managed cache / resource pool  (dispatch hot path)
#   redpanda -> managed event bus              (Kafka API compatible)
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ra-db
    environment:
      POSTGRES_USER: roadassist
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: roadassist
    ports:
      - "5434:5432"          # 5434: 5432 and 5433 are taken by other local projects
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadassist -d roadassist"]
      interval: 5s
      timeout: 5s
      retries: 20

  cache:
    image: redis:7-alpine
    container_name: ra-cache
    command: redis-server --save "" --appendonly no
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  bus:
    image: redpandadata/redpanda:v24.2.7
    container_name: ra-bus
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://127.0.0.1:9092
    ports:
      - "9092:9092"

volumes:
  pgdata:
